# Quick test configuration
data:
  sequence_length: 28
  prediction_length: 28
  batch_size: 8
  num_workers: 0
  train_split: 0.7
  val_split: 0.15
  hierarchy_levels:
    - store
    - department
    - category
    - item

model:
  attention_hidden_dim: 64
  attention_heads: 4
  attention_dropout: 0.1
  feature_dim: 128
  num_encoder_layers: 2
  num_decoder_layers: 1
  reconciliation_hidden_dim: 64
  learnable_reconciliation: true
  reconciliation_method: neural
  output_dim: 1
  quantiles: [0.1, 0.5, 0.9]

training:
  epochs: 2
  learning_rate: 0.001
  weight_decay: 0.00001
  gradient_clip: 1.0
  scheduler: cosine
  warmup_epochs: 0
  min_lr: 0.000001
  early_stopping: false
  patience: 15
  coherence_weight: 0.3
  quantile_weight: 0.7
  mixed_precision: false
  accumulation_steps: 1

evaluation:
  metrics:
    - WRMSSE
    - hierarchy_coherence_violation
    - coverage_50
    - coverage_90
    - RMSE
    - MAE
  save_predictions: true
  generate_plots: false
  plot_samples: 5

reproducibility:
  seed: 42
  deterministic: true
